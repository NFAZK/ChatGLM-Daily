name: Keepalive

# 目的：GitHub 对公开仓库的定时任务有硬规则——连续 60 天没有仓库活动，
# schedule 会被自动暂停（不报错、不通知）。每月写一次时间戳提交，把这条规则绕开。

on:
  schedule:
    - cron: "0 0 1 * *"   # 每月 1 日 00:00 UTC = 北京时间 08:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 追加时间戳
        run: |
          printf '%s\n' "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> .keepalive
          tail -5 .keepalive

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
            git push
          fi
